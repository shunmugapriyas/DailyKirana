services:
  mongodb:
    image: mongo:7
    container_name: penn-selavu-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - penn-selavu-mongo-data:/data/db

  api:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: penn-selavu-api
    depends_on:
      - mongodb
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: mongodb://mongodb:27017/penn_selavu_tracker_dev
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19006
      OTP_DEV_MODE: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - penn-selavu-maven-cache:/root/.m2

volumes:
  penn-selavu-mongo-data:
  penn-selavu-maven-cache:
